name: Model sync

# Keeps tq-forge current with new Claude model releases.
#
# Once a week (and on demand) this asks for the live list of Claude model ids.
# When a family has a newer version it updates config/models.json and the
# templates, regenerates docs/MODEL_COMPATIBILITY.md, runs the test suite, and
# opens a pull request with the change.
#
# ANTHROPIC_API_KEY is optional. With it the ids come from Anthropic's
# /v1/models; without it they come from OpenRouter's public model list.
#
# --trust-source lets the job act on OpenRouter's list when no API key is set.
# That is acceptable here, and only here, because the result is a pull request
# that a person reads before it is merged.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve
# pull requests" (Settings -> Actions -> General). Without it the branch is
# still pushed and the job says so. A pull request opened with GITHUB_TOKEN
# does not start the CI workflow, so this job runs the test suite itself
# before it pushes; re-run CI by hand on the pull request if you require it.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Sync the model registry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bin/cli.js sync-models --root . --apply --trust-source

      - name: Regenerate the compatibility matrix
        # The matrix names the current model of each family, so it changes with the registry.
        # A failing artifact is reported by the test suite in the next step.
        run: node bin/cli.js compat --write || true

      - name: Run the test suite
        run: npm test

      - name: Open a pull request when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- config templates; then
            echo "No new Claude model. Nothing to do."
            exit 0
          fi
          branch="model-sync/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add config templates docs/MODEL_COMPATIBILITY.md
          git commit -m "chore: sync Claude model registry"
          git push --force origin "$branch"
          gh pr create \
            --title "chore: sync Claude model registry" \
            --body "A newer Claude model was released. This updates \`config/models.json\`, the model profiles, the pinned \`model:\` ids in the templates and \`docs/MODEL_COMPATIBILITY.md\`. Prices marked \`inherited_from\` were copied from the previous model and need checking before merge. The test suite passed on this branch." \
            --base "${GITHUB_REF_NAME}" --head "$branch" \
            || echo "::warning::Branch $branch was pushed, but the pull request could not be opened. Enable 'Allow GitHub Actions to create and approve pull requests' or open it by hand."
