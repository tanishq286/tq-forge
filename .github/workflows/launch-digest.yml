# Weekly repo pulse & maintainer digest.
# Manual trigger: gh workflow run launch-digest.yml --repo tanishq286/tq-forge
# Triggered weekly on Mondays at 09:00 UTC.
# Soft-skips Telegram delivery when secrets are not configured; never fails red.
name: Launch digest

on:
  schedule:
    - cron: "0 9 * * 1"   # Weekly on Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      R: ${{ github.repository }}
    steps:
      - name: Build and report digest
        run: |
          set -euo pipefail
          echo "Gathering weekly digest metrics for $R..."

          STARS=$(gh api "repos/$R" --jq .stargazers_count 2>/dev/null || echo "0")
          FORKS=$(gh api "repos/$R" --jq .forks_count 2>/dev/null || echo "0")
          OPEN=$(gh api "repos/$R/issues?state=open&per_page=100" --jq length 2>/dev/null || echo "0")
          NEW24=$(gh api -H "Accept: application/vnd.github.star+json" \
                    "repos/$R/stargazers?per_page=100" --paginate \
                    --jq '[.[] | select(.starred_at > (now - 86400 | todate))] | length' \
                    2>/dev/null || echo "0")
          TRAFFIC=$(gh api "repos/$R/traffic/views" --jq '"\(.count)/\(.uniques)"' 2>/dev/null) || TRAFFIC=""
          case "$TRAFFIC" in *[0-9]/[0-9]*) ;; *) TRAFFIC="n/a (needs PAT)";; esac

          MSG=$(printf '%s\n' \
            "🔨 tq-forge weekly digest" \
            "⭐ ${STARS} stars (+${NEW24} in 24h)" \
            "👁 views: ${TRAFFIC} (14d)" \
            "🍴 ${FORKS} forks · 🐛 ${OPEN} open issues" \
            "https://github.com/${R}")

          echo "----------------------------------------"
          echo "$MSG"
          echo "----------------------------------------"

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set (TG_BOT_TOKEN / TG_CHAT_ID) — skipping notification send."
            exit 0
          fi

          curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$MSG" >/dev/null || echo "Warning: failed to send Telegram message"

          echo "Telegram digest sent successfully."
